system:
  app_name: "cctv-activity-live-webcam"
  log_level: "INFO"
  enable_api: true
  api_host: "0.0.0.0"
  api_port: 8000

cameras:
  - camera_id: "cam_live_webcam_01"
    camera_name: "Security Desk Live Webcam 01"
    source_type: "webcam"
    source_uri: 0
    enabled: true
    sample_every_n_frames: 1
    target_fps: 15.0
    max_frame_queue_size: 1
    resize_width: 640
    resize_height: 480
    connection_timeout_ms: 5000
    read_timeout_ms: 5000
    reconnect_initial_delay_sec: 1.0
    reconnect_max_delay_sec: 8.0
    reconnect_backoff_factor: 2.0
    max_reconnect_attempts: 50

pose:
  backend: "onnx"
  model_path: "models/yolov8n-pose.onnx"
  device: "cpu"
  imgsz: 640
  min_person_confidence: 0.50
  min_keypoint_confidence: 0.35
  iou_threshold: 0.45
  cpu_threads: 2

tracker:
  high_thresh: 0.60
  low_thresh: 0.25
  match_iou_thresh: 0.30
  second_match_iou_thresh: 0.20
  min_hits_to_confirm: 2
  track_expiration_seconds: 2.0
  max_window_duration_seconds: 1.5
  max_window_observations: 60

activity:
  min_observations: 6
  min_window_duration_seconds: 0.50
  standing_min_duration_seconds: 0.60
  standing_max_speed_bh_per_sec: 0.35
  walking_min_speed_bh_per_sec: 0.35
  running_min_speed_bh_per_sec: 1.80
  standing_max_ankle_std_bh: 0.035
  walking_min_ankle_std_bh: 0.025
  running_min_ankle_std_bh: 0.055
  hysteresis_count: 3
  camera_viewpoint: "cctv"
  cctv_foreshortening_factor: 1.25

risk:
  enabled: true
  rules_path: "config/risk_rules.yaml"

iuris:
  delivery_enabled: false
  dry_run: false
  base_url: ""
  events_path: "/api/v1/cctv/events"

renderer:
  draw_bbox: true
  draw_skeleton: true
  draw_track_id: true
  draw_activity: true
  draw_telemetry: true
